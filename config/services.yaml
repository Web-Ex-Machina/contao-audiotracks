services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: true
    
    WEM\AudioTracksBundle\:
        resource: ../src/
        exclude: ../src/{ContaoManager,DependencyInjection,Model,Util,Classes/RequestRateLimiter.php}


    wem.audiotracks.rss_feed:
        class: WEM\AudioTracksBundle\Classes\RssFeed
        arguments:
            $framework: '@contao.framework'
        public: true

    WEM\AudioTracksBundle\Classes\ClientIdentifier:
        arguments:
            $mode: '%wem_audiotracks.identifier%'
            $key: '%wem_contao_encryption.encryption_key%'

    WEM\AudioTracksBundle\EventListener\DataContainer\TrackingDataNoticeContainer:
        arguments:
            $retentionMonths: '%wem_audiotracks.retention_months%'
            $identifierMode: '%wem_audiotracks.identifier%'

    WEM\AudioTracksBundle\Cron\PurgeTrackingDataCron:
        arguments:
            $retentionMonths: '%wem_audiotracks.retention_months%'

    WEM\AudioTracksBundle\Migration\DurationMigration:
        arguments:
            $projectDir: '%kernel.project_dir%'
